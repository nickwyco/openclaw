<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WyCo Vintage Label Printer</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; margin: 0; background: #f2f2f5; color: #111; }

  /* ---------- Controls (hidden when printing) ---------- */
  #controls {
    max-width: 640px; margin: 0 auto; padding: 20px 16px;
  }
  #controls h1 { font-size: 20px; margin: 0 0 4px; }
  #controls p.hint { margin: 0 0 16px; color: #555; font-size: 13px; line-height: 1.4; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; color: #333; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; font-size: 15px;
    border: 1px solid #ccc; border-radius: 6px; background: #fff;
  }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  button#printBtn {
    width: 100%; padding: 12px; font-size: 16px; font-weight: 700;
    background: #111; color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  button#printBtn:active { background: #333; }
  #preview-wrap { margin-top: 20px; }
  #preview-wrap h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #666; margin: 0 0 8px; }
  #preview { background: #fff; border: 1px dashed #bbb; padding: 12px; display: inline-block; }

  /* ---------- The label itself ---------- */
  .label {
    width: var(--lw); height: var(--lh);
    background: #fff; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 0.05in 0.08in 0.03in;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .label .title {
    font-weight: 700; text-align: center; white-space: nowrap;
    line-height: 1.05;
  }
  .label .mid { flex: 1; display: flex; align-items: stretch; min-height: 0; gap: 0.04in; }
  .label .barcode-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .label .barcode-col svg { width: 100%; flex: 1; min-height: 0; }
  .label .sku { text-align: center; font-size: var(--sku-size); line-height: 1.1; letter-spacing: .12em; }
  .label .price {
    display: flex; align-items: center; font-weight: 700; white-space: nowrap;
  }
  .label .brand {
    display: flex; align-items: center; justify-content: center; gap: 0.045in;
    font-weight: 700; letter-spacing: .08em; line-height: 1.05;
  }
  .label .brand .brand-name { text-align: left; }
  .label .brand svg { display: block; }

  /* ---------- Print sheet ---------- */
  #sheet { display: none; }

  @media print {
    #controls { display: none; }
    #sheet { display: block; }
    body { background: #fff; }
    .label { page-break-after: always; break-after: page; }
    .label:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>

<div id="controls">
  <h1>WyCo Vintage — Dymo Label Printer</h1>
  <p class="hint">Fill in the label, set the quantity, hit <b>Print</b>, and choose your DYMO LabelWriter
     in the print dialog (set margins to None / scale 100%). Works from any computer where the
     Dymo is installed as a printer.</p>
  <div class="field">
    <label for="title">Item title</label>
    <input id="title" value="$40 Rock Tee">
  </div>
  <div class="row">
    <div class="field">
      <label for="sku">Barcode / SKU</label>
      <input id="sku" value="B07042601">
    </div>
    <div class="field">
      <label for="price">Price</label>
      <input id="price" value="$ 40">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="size">Label size</label>
      <select id="size">
        <option value="2.125x1">DYMO 30336 — 1" × 2-1/8" (multipurpose)</option>
        <option value="2.25x1.25">DYMO 30334 — 1-1/4" × 2-1/4" (medium multipurpose)</option>
        <option value="3.5x1.125">DYMO 30252 — 1-1/8" × 3-1/2" (address)</option>
        <option value="1.875x0.5">DYMO 30346 — 1/2" × 1-7/8" (library/small)</option>
      </select>
    </div>
    <div class="field">
      <label for="qty">Quantity</label>
      <input id="qty" type="number" min="1" max="500" value="25">
    </div>
  </div>
  <button id="printBtn">Print labels</button>
  <div id="preview-wrap">
    <h2>Preview (actual size)</h2>
    <div id="preview"></div>
  </div>
</div>

<div id="sheet"></div>

<script>
"use strict";

/* ---------- Code 128 (auto B/C) barcode, no dependencies ---------- */
const C128 = (() => {
  const PATTERNS = [
    "212222","222122","222221","121223","121322","131222","122213","122312",
    "132212","221213","221312","231212","112232","122132","122231","113222",
    "123122","123221","223211","221132","221231","213212","223112","312131",
    "311222","321122","321221","312212","322112","322211","212123","212321",
    "232121","111323","131123","131321","112313","132113","132311","211313",
    "231113","231311","112133","112331","132131","113123","113321","133121",
    "313121","211331","231131","213113","213311","213131","311123","311321",
    "331121","312113","312311","332111","314111","221411","431111","111224",
    "111422","121124","121421","141122","141221","112214","112412","122114",
    "122411","142112","142211","241211","221114","413111","241112","134111",
    "111242","121142","121241","114212","124112","124211","411212","421112",
    "421211","212141","214121","412121","111143","111341","131141","114113",
    "114311","411113","411311","113141","114131","311141","411131","211412",
    "211214","211232"
  ];
  const STOP = "2331112";
  const START_B = 104;

  function encode(text) {
    // Code set B only — covers ASCII 32..127, plenty for SKUs.
    const values = [START_B];
    for (const ch of text) {
      const v = ch.charCodeAt(0) - 32;
      if (v < 0 || v > 95) throw new Error("Unsupported character: " + ch);
      values.push(v);
    }
    let checksum = values[0];
    for (let i = 1; i < values.length; i++) checksum += values[i] * i;
    values.push(checksum % 103);
    return values.map(v => PATTERNS[v]).join("") + STOP;
  }

  // Render as SVG. Bars are exact integer multiples of the module width.
  function svg(text) {
    const widths = encode(text);
    let total = 0;
    for (const w of widths) total += +w;
    const QUIET = 8; // quiet zone, modules
    const vbW = total + QUIET * 2;
    let x = QUIET, bars = "";
    for (let i = 0; i < widths.length; i++) {
      const w = +widths[i];
      if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="100"/>`;
      x += w;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${vbW} 100" preserveAspectRatio="none" shape-rendering="crispEdges"><g fill="#000">${bars}</g></svg>`;
  }
  return { svg };
})();

/* ---------- WyCo circled-A mark ---------- */
function logoSvg(sizeIn) {
  return `<svg width="${sizeIn}in" height="${sizeIn}in" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#000" fill="none" stroke-linecap="round">
      <circle cx="50" cy="50" r="38" stroke-width="9"/>
      <path d="M28 72 L50 20 L72 72" stroke-width="9"/>
      <path d="M20 58 L82 58" stroke-width="9"/>
    </g>
  </svg>`;
}

/* ---------- Label builder ---------- */
function buildLabel(opts) {
  const { title, sku, price, w, h } = opts;
  const el = document.createElement("div");
  el.className = "label";
  el.style.setProperty("--lw", w + "in");
  el.style.setProperty("--lh", h + "in");
  // Scale type to label height
  const titleSize = (h * 0.18).toFixed(3);
  const priceSize = (h * 0.17).toFixed(3);
  const skuSize   = (h * 0.11).toFixed(3);
  const brandSize = (h * 0.085).toFixed(3);
  const logoSize  = (h * 0.22).toFixed(3);
  el.style.setProperty("--sku-size", skuSize + "in");
  el.innerHTML = `
    <div class="title" style="font-size:${titleSize}in">${esc(title)}</div>
    <div class="mid">
      <div class="barcode-col">
        ${C128.svg(sku)}
        <div class="sku">${esc(sku)}</div>
      </div>
      <div class="price" style="font-size:${priceSize}in">${esc(price)}</div>
    </div>
    <div class="brand" style="font-size:${brandSize}in">
      ${logoSvg(logoSize)}
      <div class="brand-name">WYCO<br>VINTAGE</div>
    </div>`;
  return el;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

/* ---------- Wiring ---------- */
const $ = id => document.getElementById(id);

function currentOpts() {
  const [w, h] = $("size").value.split("x").map(Number);
  return {
    title: $("title").value,
    sku: $("sku").value,
    price: $("price").value,
    qty: Math.max(1, Math.min(500, parseInt($("qty").value, 10) || 1)),
    w, h
  };
}

function refresh() {
  const opts = currentOpts();
  // page size must match the label for the Dymo driver
  let pageStyle = document.getElementById("pageStyle");
  if (!pageStyle) {
    pageStyle = document.createElement("style");
    pageStyle.id = "pageStyle";
    document.head.appendChild(pageStyle);
  }
  pageStyle.textContent = `@page { size: ${opts.w}in ${opts.h}in; margin: 0; }`;

  const preview = $("preview");
  preview.innerHTML = "";
  try {
    preview.appendChild(buildLabel(opts));
  } catch (e) {
    preview.textContent = e.message;
    return;
  }
  const sheet = $("sheet");
  sheet.innerHTML = "";
  for (let i = 0; i < opts.qty; i++) sheet.appendChild(buildLabel(opts));
}

for (const id of ["title", "sku", "price", "size", "qty"]) {
  $(id).addEventListener("input", refresh);
}
$("printBtn").addEventListener("click", () => { refresh(); window.print(); });

// URL params override defaults (used for automated PDF generation):
// ?title=...&sku=...&price=...&qty=25&size=2.125x1
const params = new URLSearchParams(location.search);
for (const key of ["title", "sku", "price", "qty", "size"]) {
  if (params.has(key)) $(key).value = params.get(key);
}
refresh();
</script>
</body>
</html>
